<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
let audio = null;
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.action !== 'jackSound') return;
  try {
    if (!audio) {
      audio = new Audio('nui://jack-the-ripper/jack.mp3');
      audio.preload = 'auto';
    }
    audio.volume = Math.min(1, Math.max(0, d.volume ?? 0.8));
    audio.currentTime = 0;
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
  } catch (err) {}
});
</script>
</head>
<body></body>
</html>
